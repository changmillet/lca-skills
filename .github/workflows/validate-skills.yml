name: validate-skills

on:
  workflow_dispatch:

jobs:
  validate:
    name: validate (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout skills
        uses: actions/checkout@v7

      - name: Checkout tiangong-lca-cli
        uses: actions/checkout@v7
        with:
          repository: tiangong-lca/tiangong-cli
          ref: cli-v0.1.1
          path: .ci/tiangong-lca-cli

      - name: Setup pnpm 11.23.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false

      - name: Setup Node 24.19.0
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .ci/tiangong-lca-cli/pnpm-lock.yaml

      - name: Install Skills validation package
        run: pnpm install --frozen-lockfile

      - name: Install and build CLI
        working-directory: .ci/tiangong-lca-cli
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Test Skills repository contracts
        run: pnpm test

      - name: Validate exact published CLI fallback
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x64'
        run: node process-hybrid-search/scripts/run-process-hybrid-search.mjs --help

      - name: Validate skills
        env:
          TIANGONG_LCA_CLI_DIR: ${{ github.workspace }}/.ci/tiangong-lca-cli
        run: pnpm validate
